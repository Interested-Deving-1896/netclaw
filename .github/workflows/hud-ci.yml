name: HUD checks

on:
  pull_request:
    paths:
      - 'ui/netclaw-visual/**'
      - '.github/workflows/hud-ci.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hud:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui/netclaw-visual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/netclaw-visual/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
